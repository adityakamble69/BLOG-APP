<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blogs · Blog App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Blog App</h1>
    <nav id="nav"></nav>
  </header>

  <main>
    <div class="card" id="createCard" style="display:none;">
      <h2>Write a new post</h2>
      <form id="blogForm">
        <label for="title">Title</label>
        <input type="text" id="title" required />

        <label for="content">Content</label>
        <textarea id="content" required></textarea>

        <button type="submit" class="primary">Publish</button>
      </form>
      <div id="message" class="msg"></div>
    </div>

    <div class="card" id="loginPrompt" style="display:none; margin-bottom:1.5rem;">
      <p style="margin:0;">
        <a href="login.html">Log in</a> to write a blog post.
      </p>
    </div>

    <h2 style="margin-top:2.5rem;">All Posts</h2>
    <div id="posts">Loading…</div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const nav = document.getElementById('nav');
    const user = getUser();

    if (user) {
      nav.innerHTML = `<span>Hi, ${user.name}</span> <button id="logoutBtn">Log Out</button>`;
      document.getElementById('createCard').style.display = 'block';
    } else {
      nav.innerHTML = `<a href="login.html">Log In</a> <a href="register.html">Sign Up</a>`;
      document.getElementById('loginPrompt').style.display = 'block';
    }

    document.addEventListener('click', (e) => {
      if (e.target.id === 'logoutBtn') {
        clearSession();
        window.location.href = 'login.html';
      }
    });

    async function loadBlogs() {
      const postsEl = document.getElementById('posts');
      try {
        const data = await apiRequest('/blogs');
        if (data.blogs.length === 0) {
          postsEl.innerHTML = '<p>No posts yet. Be the first to write one!</p>';
          return;
        }
        postsEl.innerHTML = data.blogs
          .map(
            (b) => `
          <div class="blog-post">
            <h3>${escapeHtml(b.title)}</h3>
            <div class="blog-meta">by ${escapeHtml(b.author)} · ${new Date(b.created_at).toLocaleDateString()}</div>
            <p>${escapeHtml(b.content)}</p>
          </div>`
          )
          .join('');
      } catch (err) {
        postsEl.innerHTML = `<p style="color:#b3261e;">Failed to load posts: ${err.message}</p>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const blogForm = document.getElementById('blogForm');
    if (blogForm) {
      blogForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const msg = document.getElementById('message');

        try {
          await apiRequest('/blogs', {
            method: 'POST',
            auth: true,
            body: { title, content },
          });
          msg.textContent = 'Post published!';
          msg.className = 'msg success';
          blogForm.reset();
          loadBlogs();
        } catch (err) {
          msg.textContent = err.message;
          msg.className = 'msg error';
        }
      });
    }

    loadBlogs();
  </script>
</body>
</html>
